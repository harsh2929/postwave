# NON-PRODUCTION: local integration-test topology only. This file is not a
# production, Swarm, Kubernetes, or client-data deployment contract. The
# canonical Moosewave Cloud path is infra/aws/PRODUCTION_DEPLOY_RUNBOOK.md.
#
# Full local Docker stack for product testing.
#
# Usage from repo root:
#   POSTWAVE_POSTGRES_PORT=15432 POSTWAVE_REDIS_PORT=16379 \
#     /Applications/Docker.app/Contents/Resources/bin/docker compose \
#     -f infra/docker-compose.yml -f infra/docker-compose.full.yml up -d --build

x-postwave-common-env: &postwave-common-env
  LOG_LEVEL: info
  DATABASE_URL: postgres://postwave_app:postwave_app_dev@postgres:5432/postwave?sslmode=disable
  LISTMONK_URL: http://listmonk:9000
  LISTMONK_ADMIN_USER: api
  LISTMONK_ADMIN_PASSWORD: listmonk
  POSTWAVE_INTERNAL_API_TOKEN: ${POSTWAVE_INTERNAL_API_TOKEN}
  POSTWAVE_MIGRATION_SESSION_KEK: "hex:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
  # Pass-through from the host shell so the Moosewave AI panel can talk to
  # Gemini. Empty in CI / fresh checkouts: the voice service degrades to
  # MockLLMClient and the chat endpoint returns 503 with a configure-key
  # hint. Set it before `docker compose up`:
  #   export GEMINI_API_KEY=AIza…
  #   docker compose -f infra/docker-compose.full.yml up -d --build voice
  # Legacy ANTHROPIC_API_KEY is accepted with a deprecation warn for one
  # release; both pass through so an in-progress cutover doesn't break.
  GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
  ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
  OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
  # OpenTelemetry trace export to the Jaeger all-in-one service below.
  # InitTracing in each Go service is a no-op when OTEL_EXPORTER_OTLP_ENDPOINT
  # is unset; here in the local compose stack we wire it explicitly so every
  # container ships spans to http://localhost:16686/ (Jaeger UI).
  OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4317
  # Plaintext OTLP is accepted only through this explicit local-development
  # opt-in. Staging/production startup rejects the insecure flag.
  OTEL_EXPORTER_OTLP_INSECURE: "true"
  OTEL_TRACES_SAMPLER_ARG: "1.0"  # 100% in dev compose

services:
  listmonk-api-token:
    image: postgres:16-alpine
    container_name: postwave-listmonk-api-token
    depends_on:
      listmonk-init:
        condition: service_completed_successfully
    environment:
      LISTMONK_DATABASE_URL: postgres://postgres:public-local-demo-only@postgres:5432/listmonk?sslmode=disable
      PGPASSWORD: public-local-demo-only
    command:
      - sh
      - -euc
      - |
        psql "$$LISTMONK_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
        UPDATE users
        SET password = 'listmonk'
        WHERE username = 'api' AND type = 'api';
        SQL
    restart: "no"
    networks:
      - default

  listmonk:
    depends_on:
      listmonk-api-token:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --header='Authorization: Basic YXBpOmxpc3Rtb25r' http://127.0.0.1:9000/api/lists >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  db-migrate:
    build:
      context: ..
      dockerfile: infra/migrations/Dockerfile
    container_name: postwave-db-migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:public-local-demo-only@postgres:5432/postwave?sslmode=disable
      # Fresh local databases must replay the one historical partition
      # migration that the production safety scanner classifies as
      # destructive. Existing/production databases never set this flag.
      POSTWAVE_MIGRATOR_ALLOW_UNSAFE: "1"
      POSTWAVE_MIGRATOR_TIMEOUT: "30m"
    restart: "no"
    networks:
      - default

  # Local-only demo fixtures are deliberately separate from the canonical
  # migrator artifact. This keeps production schema application deterministic
  # and makes it impossible for seed SQL to enter a release image.
  db-seed:
    image: postgres:16-alpine
    container_name: postwave-db-seed
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    environment:
      MIGRATIONS_DATABASE_URL: postgres://postgres:public-local-demo-only@postgres:5432/postwave?sslmode=disable
      PGPASSWORD: public-local-demo-only
    command:
      - sh
      - -euc
      - |
        psql "$$MIGRATIONS_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
        INSERT INTO tenants (id, slug, name, tier)
        VALUES ('00000000-0000-0000-0000-000000000001', 'demo', 'Demo Workspace', 'studio')
        ON CONFLICT (slug) DO NOTHING;

        INSERT INTO sending_state (
          tenant_id, tier, postmark_server_id, postmark_stream_id, dkim_domain, dedicated_ip
        )
        VALUES (
          '00000000-0000-0000-0000-000000000001',
          'studio',
          'local-demo',
          'broadcast',
          'example.com',
          ''
        )
        ON CONFLICT (tenant_id) DO UPDATE SET
          tier = EXCLUDED.tier,
          postmark_server_id = EXCLUDED.postmark_server_id,
          postmark_stream_id = EXCLUDED.postmark_stream_id,
          dkim_domain = EXCLUDED.dkim_domain,
          dedicated_ip = EXCLUDED.dedicated_ip,
          updated_at = now();
        SQL
    restart: "no"
    networks:
      - default

  migration:
    build:
      context: ..
      dockerfile: Dockerfile.go
      args:
        SERVICE_PATH: ./services/migration
        SERVICE_PORT: "8081"
        HEALTHCHECK_PATH: /health
    container_name: postwave-migration
    depends_on:
      db-seed:
        condition: service_completed_successfully
      listmonk:
        condition: service_healthy
      jaeger:
        condition: service_started
    environment:
      <<: *postwave-common-env
      PORT: "8081"
      OAUTH_REDIRECT_URI: http://localhost:3000/app/migrations/oauth/callback?source={source}
      ACTIVECAMPAIGN_ALLOWED_API_HOSTS: "${ACTIVECAMPAIGN_ALLOWED_API_HOSTS:-}"
      POSTWAVE_MIGRATION_DEMO_MODE: "1"
      # The full local stack has one seeded tenant and one isolated Listmonk
      # database. Bind them explicitly so non-demo fixture jobs use the same
      # fail-closed boundary as a controlled certification deployment (the
      # built-in demo path itself performs no destination writes).
      LISTMONK_TENANT_MODE: dedicated
      LISTMONK_DEDICATED_TENANT_ID: 00000000-0000-0000-0000-000000000001
    ports:
      - "127.0.0.1:8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - default

  deliverability:
    build:
      context: ..
      dockerfile: Dockerfile.go
      args:
        SERVICE_PATH: ./services/deliverability
        SERVICE_PORT: "8082"
        HEALTHCHECK_PATH: /health
    container_name: postwave-deliverability
    depends_on:
      db-seed:
        condition: service_completed_successfully
      listmonk:
        condition: service_healthy
      jaeger:
        condition: service_started
    environment:
      <<: *postwave-common-env
      PORT: "8082"
    ports:
      - "127.0.0.1:8082:8082"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8082/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - default

  voice:
    build:
      context: ..
      dockerfile: Dockerfile.go
      args:
        SERVICE_PATH: ./services/voice
        SERVICE_PORT: "8083"
        HEALTHCHECK_PATH: /health
    container_name: postwave-voice
    depends_on:
      db-seed:
        condition: service_completed_successfully
      listmonk:
        condition: service_healthy
      jaeger:
        condition: service_started
    environment:
      <<: *postwave-common-env
      PORT: "8083"
    ports:
      - "127.0.0.1:8083:8083"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8083/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - default

  automation:
    build:
      context: ..
      dockerfile: Dockerfile.go
      args:
        SERVICE_PATH: ./services/automation
        SERVICE_PORT: "8084"
        HEALTHCHECK_PATH: /health
    container_name: postwave-automation
    depends_on:
      db-seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      listmonk:
        condition: service_healthy
      jaeger:
        condition: service_started
    environment:
      <<: *postwave-common-env
      PORT: "8084"
      REDIS_URL: redis://redis:6379/0
      LISTMONK_ADMIN_USER: api
      LISTMONK_ADMIN_PASSWORD: listmonk
    ports:
      - "127.0.0.1:8084:8084"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8084/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - default

  api:
    build:
      context: ..
      dockerfile: Dockerfile.go
      args:
        SERVICE_PATH: ./apps/api
        SERVICE_PORT: "8080"
        HEALTHCHECK_PATH: /api/ready
    container_name: postwave-api
    depends_on:
      db-seed:
        condition: service_completed_successfully
      migration:
        condition: service_healthy
      deliverability:
        condition: service_healthy
      voice:
        condition: service_healthy
      automation:
        condition: service_healthy
      listmonk:
        condition: service_healthy
      jaeger:
        condition: service_started
    environment:
      <<: *postwave-common-env
      PORT: "8080"
      LISTMONK_USER: api
      LISTMONK_PASSWORD: listmonk
      MIGRATION_SERVICE_URL: http://migration:8081
      DELIVERABILITY_SERVICE_URL: http://deliverability:8082
      VOICE_SERVICE_URL: http://voice:8083
      AUTOMATION_SERVICE_URL: http://automation:8084
      POSTWAVE_SENDING_KEK: 0123456789abcdef0123456789abcdef
      POSTWAVE_DEV_TENANT_SLUG_HEADER: "1"
      POSTWAVE_DEV_ADMIN_ROLE_HEADER: "1"
      POSTWAVE_DEV_TRANSACTIONAL_SINK: "1"
      POSTWAVE_DEV_LISTMONK_WEBHOOK_BYPASS: "1"
      POSTWAVE_DEV_SHOPIFY_WEBHOOK_BYPASS: "1"
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://web:3000
      FORMS_PUBLIC_HOST: http://localhost:3000
      MARKETING_HOME_URL: http://localhost:3000
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/ready >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - default

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    container_name: postwave-web
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_URL: http://api:8080
      POSTWAVE_API_URL: http://api:8080
      NEXT_PUBLIC_TENANT_SLUG: demo
      POSTWAVE_LOCAL_AUTH_BYPASS: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: "3000"
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - default

  # Jaeger all-in-one — receives OTLP gRPC on 4317, serves UI on 16686.
  # Each Go service picks up OTEL_EXPORTER_OTLP_ENDPOINT from the common
  # env block above so spans land here automatically. Open
  # http://localhost:16686 to browse traces.
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: postwave-jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "127.0.0.1:16686:16686"  # UI
      - "127.0.0.1:4317:4317"    # OTLP gRPC ingest
    networks:
      - default
# NON-PRODUCTION: local integration-test topology only. This file is not a
# production, Swarm, Kubernetes, or client-data deployment contract. The
# canonical Moosewave Cloud path is infra/aws/PRODUCTION_DEPLOY_RUNBOOK.md.

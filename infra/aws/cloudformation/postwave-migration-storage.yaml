AWSTemplateFormatVersion: "2010-09-09"
Description: Encrypted regional EFS storage for resumable migration uploads. Local template only; application rollout is separate.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  PrivateSubnetA:
    Type: AWS::EC2::Subnet::Id
  PrivateSubnetB:
    Type: AWS::EC2::Subnet::Id
    Description: A private subnet in a different Availability Zone from PrivateSubnetA.
  MigrationSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  MigrationTaskRoleArn:
    Type: String
    AllowedPattern: '^arn:aws[a-z-]*:iam::[0-9]{12}:role/.+$'

Resources:
  UploadSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: NFS from migration workers only
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 2049
          ToPort: 2049
          SourceSecurityGroupId: !Ref MigrationSecurityGroupId
      SecurityGroupEgress: []

  UploadFileSystem:
    Type: AWS::EFS::FileSystem
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Encrypted: true
      PerformanceMode: generalPurpose
      ThroughputMode: elastic
      BackupPolicy:
        Status: ENABLED
      FileSystemPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: RequireTransportEncryption
            Effect: Deny
            Principal: "*"
            Action: elasticfilesystem:Client*
            Resource: "*"
            Condition:
              Bool:
                aws:SecureTransport: "false"
          - Sid: MigrationWorkers
            Effect: Allow
            Principal:
              AWS: !Ref MigrationTaskRoleArn
            Action:
              - elasticfilesystem:ClientMount
              - elasticfilesystem:ClientWrite
            Resource: "*"
      FileSystemTags:
        - Key: Purpose
          Value: migration-source-uploads

  UploadMountA:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref UploadFileSystem
      SubnetId: !Ref PrivateSubnetA
      SecurityGroups: [!Ref UploadSecurityGroup]

  UploadMountB:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref UploadFileSystem
      SubnetId: !Ref PrivateSubnetB
      SecurityGroups: [!Ref UploadSecurityGroup]

  UploadAccessPoint:
    Type: AWS::EFS::AccessPoint
    Properties:
      FileSystemId: !Ref UploadFileSystem
      PosixUser:
        Uid: "10001"
        Gid: "10001"
      RootDirectory:
        Path: /migration-uploads
        CreationInfo:
          OwnerUid: "10001"
          OwnerGid: "10001"
          Permissions: "0700"

Outputs:
  FileSystemId:
    Value: !Ref UploadFileSystem
  AccessPointId:
    Value: !Ref UploadAccessPoint
  SecurityGroupId:
    Value: !Ref UploadSecurityGroup

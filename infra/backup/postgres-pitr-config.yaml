# SPDX-License-Identifier: AGPL-3.0-only
# Render with ./render-manifests.sh. Tokens make accidental direct deployment
# fail closed; a deployable image reference must include an OCI sha256 digest.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postwave-postgres-backup
  namespace: postwave
  labels:
    app.kubernetes.io/name: postwave
    app.kubernetes.io/component: backup
  annotations:
    eks.amazonaws.com/role-arn: "__BACKUP_WRITER_ROLE_ARN__"
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postwave-backup-evidence-signer
  namespace: postwave
  labels:
    app.kubernetes.io/name: postwave
    app.kubernetes.io/component: backup-evidence-signer
  annotations:
    eks.amazonaws.com/role-arn: "__BACKUP_SIGNER_ROLE_ARN__"
automountServiceAccountToken: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-walg-config
  namespace: postwave
  labels:
    app.kubernetes.io/name: postwave
    app.kubernetes.io/component: backup
data:
  AWS_REGION: "__AWS_REGION__"
  BACKUP_REPLICA_REGION: "__BACKUP_REPLICA_REGION__"
  BACKUP_BUCKET: "__BACKUP_BUCKET__"
  BACKUP_REPLICA_BUCKET: "__BACKUP_REPLICA_BUCKET__"
  BACKUP_KMS_KEY_ID: "__BACKUP_KMS_KEY_ID__"
  BACKUP_EVIDENCE_SIGNING_KEY_ID: "__BACKUP_EVIDENCE_SIGNING_KEY_ID__"
  BACKUP_ENVIRONMENT: "__BACKUP_ENVIRONMENT__"
  BACKUP_CLUSTER_ID: "__BACKUP_CLUSTER_ID__"
  POSTGRES_SYSTEM_IDENTIFIER: "__POSTGRES_SYSTEM_IDENTIFIER__"
  BACKUP_METRIC_NAMESPACE: "Postwave/Backup"
  WALG_S3_PREFIX: "s3://__BACKUP_BUCKET__/postgres/__BACKUP_ENVIRONMENT__/clusters/__BACKUP_CLUSTER_ID__/walg"
  WALG_S3_SSE: "aws:kms"
  WALG_S3_SSE_KMS_ID: "__BACKUP_KMS_KEY_ID__"
  WALG_COMPRESSION_METHOD: "lz4"
  WALG_DELTA_MAX_STEPS: "6"
  WALG_DELTA_ORIGIN: "LATEST_FULL"
  WALG_PREVENT_WAL_OVERWRITE: "true"
  WALG_VERIFY_PAGE_CHECKSUMS: "true"
  WALG_UPLOAD_CONCURRENCY: "4"
  WALG_UPLOAD_DISK_CONCURRENCY: "2"
  BASE_BACKUP_INTERVAL_SECONDS: "86400"
  BASE_BACKUP_CHECK_SECONDS: "900"
  BASE_BACKUP_TIMEOUT_SECONDS: "21600"
  WAL_VERIFY_TIMEOUT_SECONDS: "3600"
  MAX_UNSIGNED_BASE_EVIDENCE_BACKLOG: "64"
  PGHOST: "postwave-postgres.postwave.svc.cluster.local"
  PGPORT: "5432"
  PGDATABASE: "postwave"
  PGDATA: "/var/lib/postgresql/data/pgdata"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup-monitor
  namespace: postwave
  labels:
    app.kubernetes.io/name: postwave
    app.kubernetes.io/component: backup-monitor
spec:
  schedule: "*/5 * * * *"
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 6
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 240
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: postwave
            app.kubernetes.io/component: backup-monitor
        spec:
          serviceAccountName: postwave-postgres-backup
          automountServiceAccountToken: true
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            fsGroup: 999
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: monitor
              image: "__BACKUP_IMAGE__"
              imagePullPolicy: IfNotPresent
              command: ["/usr/local/bin/postwave-monitor-backups"]
              envFrom:
                - configMapRef:
                    name: postgres-walg-config
              env:
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: postwave-backup-db
                      key: username
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postwave-backup-db
                      key: password
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: "100m"
                  memory: "128Mi"
                limits:
                  cpu: "500m"
                  memory: "512Mi"
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: "128Mi"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-wal-integrity-monitor
  namespace: postwave
  labels:
    app.kubernetes.io/name: postwave
    app.kubernetes.io/component: wal-integrity-monitor
spec:
  schedule: "17 */6 * * *"
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 900
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 6
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 3900
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: postwave
            app.kubernetes.io/component: wal-integrity-monitor
        spec:
          serviceAccountName: postwave-postgres-backup
          automountServiceAccountToken: true
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            fsGroup: 999
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: wal-integrity-monitor
              image: "__BACKUP_IMAGE__"
              imagePullPolicy: IfNotPresent
              command: ["/usr/local/bin/postwave-monitor-wal-integrity"]
              envFrom:
                - configMapRef:
                    name: postgres-walg-config
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: "100m"
                  memory: "128Mi"
                limits:
                  cpu: "1"
                  memory: "1Gi"
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: "256Mi"

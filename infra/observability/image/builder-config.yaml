dist:
  module: github.com/postwave/postwave/observability/collector
  name: postwave-otelcol
  description: Minimal OpenTelemetry Collector for Moosewave production metrics
  version: 0.156.0-postwave.1
  output_path: /out/collector
  build_tags: grpcnotrace

extensions:
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/healthcheckextension v0.156.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/sigv4authextension v0.156.0

exporters:
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/exporter/prometheusremotewriteexporter v0.156.0

processors:
  - gomod: go.opentelemetry.io/collector/processor/batchprocessor v0.156.0
  - gomod: go.opentelemetry.io/collector/processor/memorylimiterprocessor v0.156.0

receivers:
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/prometheusreceiver v0.156.0

providers:
  - gomod: go.opentelemetry.io/collector/confmap/provider/envprovider v1.62.0

# OCB resolves the upstream 0.156 graph before the next collector release.
# Pin security-fixed transitive modules explicitly so regeneration cannot
# reintroduce the vulnerable versions into the checked-in release source.
replaces:
  - golang.org/x/crypto => golang.org/x/crypto v0.56.0
  - golang.org/x/mod => golang.org/x/mod v0.40.0
  - google.golang.org/grpc => google.golang.org/grpc v1.83.2
  - golang.org/x/image => golang.org/x/image v0.45.0
  - golang.org/x/text => golang.org/x/text v0.41.0

# osv-scanner configuration for the Moosewave monorepo.
#
# CI gates on Trivy (CRITICAL/HIGH fixable) + govulncheck (Go reachability) +
# CodeQL — osv-scanner is used for the broader manual dependency audit. This
# file records deliberate, justified suppressions of FALSE POSITIVES and
# verified backports so a web/backend release scan is actionable. Desktop
# Rust lifecycle advisories remain visible in a full-repository scan.
#
# NOT suppressed here (intentionally left visible):
#   * Go `stdlib` advisories — osv-scanner reads each module's minimum `go`
#     directive (some reusable modules intentionally remain below 1.26), but
#     the workspace and release build toolchain are pinned to go1.26.8
#     (go.work + Dockerfile.go), so the compiled stdlib is patched. govulncheck
#     (call-graph reachability) reports 0 reachable across all modules.
#   * Cargo/RUSTSEC GTK3 + unmaintained-crate advisories — suppressed in
#     apps/desktop/src-tauri/audit.toml (Linux-gated, not in the shipped
#     macOS/Windows binaries). See that file for per-advisory justification.

[[IgnoredVulns]]
id = "GHSA-589f-c66p-hxr4"
# alias CVE-2022-21802. FALSE POSITIVE: the OSV affected range is malformed
# (introduced:0 with no `fixed` event), but this grapesjs XSS was patched in
# 0.19.5 and apps/web pins ^0.21.13 (0.21.13 installed) — well past the fix.
# GitHub Advisory DB (pnpm audit) correctly does NOT flag it. Re-evaluate if
# grapesjs is ever downgraded below 0.19.5.
reason = "Fixed in grapesjs 0.19.5; installed 0.21.13. OSV range missing the fixed boundary (data bug)."


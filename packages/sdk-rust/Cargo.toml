[package]
name = "postwave"
version = "0.1.0"
edition = "2021"
description = "Official Rust client for the Moosewave API"
license = "MIT"
repository = "https://github.com/postwave/postwave-rust"

[dependencies]
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.26.4"
      - uses: golangci/golangci-lint-action@55c2c1448f86e01eaae002a5a3a9624417608d84
        with:
          version: v1.62

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.26.4"
      - run: go test -race -cover ./...

  license-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Verify SPDX header on every Go file
        run: |
          set -e
          missing=0
          while IFS= read -r f; do
            first=$(head -n 1 "$f")
            if [ "$first" != "// SPDX-License-Identifier: MIT" ]; then
              echo "missing header: $f"
              missing=$((missing + 1))
            fi
          done < <(find . -type f -name '*.go' -not -path './vendor/*')
          if [ "$missing" -gt 0 ]; then
            echo "$missing files lack the MIT SPDX header"
            exit 1
          fi

[tool.poetry]
name = "postwave"
version = "0.1.0"
description = "Official Python SDK for the Moosewave email platform — campaigns, subscribers, sequences, voice, sandbox, budgets, approvals. Designed for software agents and developer-driven workflows."
authors = ["Moosewave Engineering <api@moosewave.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://moosewave.com/forge"
repository = "https://github.com/postwave/sdk-python"
documentation = "https://moosewave.com/forge/docs"
keywords = ["postwave", "email", "newsletter", "marketing-automation", "agent", "agents", "ai", "mcp", "sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Email",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
packages = [{ include = "postwave" }]

[tool.poetry.dependencies]
python = "^3.10"
httpx = "^0.27"
pydantic = "^2.5"
tzdata = ">=2024.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.23"
mypy = "^1.10"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

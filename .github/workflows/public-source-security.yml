name: Public source security
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reject private and runtime files
        run: python3 scripts/check-public-source.py --history
      - name: Install checksum-pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --output "$archive" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
      - name: Scan files and every Git ref
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/gitleaks" dir . --config .gitleaks.toml --ignore-gitleaks-allow --redact=100 --no-banner
          "$RUNNER_TEMP/gitleaks" git . --log-opts="--all" --config .gitleaks.toml --ignore-gitleaks-allow --redact=100 --no-banner

regexTarget = "match"
paths = ['''(?:^|/)scripts/validate\-live\-migrations\.mjs$''']
regexes = ['''^credentialCleanupEvidenceRef:\ "BEEHIIV\-KEY\-ROTATION\-123"$''']

[[allowlists]]

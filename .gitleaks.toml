paths = ['''(?:^|/)apps/api/internal/routeauth/manifest\.json$''']
regexes = ['''^openapi_yaml_sha256":\ "1e63b2c406c682698fcd262698b0ea790174e166bd71660e570e13a3539dbc0c"$''']

[[allowlists]]
description = "Public-source review: hostile-URL validation unit-test fixture"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "match"
paths = ['''(?:^|/)apps/desktop/src\-tauri/src/api_broker\.rs$''']
regexes = ['''^api\.moosewave\.com:8443/api/v1/campaigns"$''']

[[allowlists]]
description = "Public-source review: invalid PEM-format test string containing only the word fixture; no key material"
targetRules = ["private-key"]
condition = "AND"
regexTarget = "match"
paths = ['''(?:^|/)apps/mobile/src/lib/easSubmitProfileScript\.test\.ts$''']
regexes = ['''^\-\-\-\-\-BEGIN\ PRIVATE\ KEY\-\-\-\-\-\\nfixture\\n\-\-\-\-\-END\ PRIVATE\ KEY\-\-\-\-\-\\n";\
\ \ \ \ await\ prepareSubmitProfile\(\{\
\ \ \ \ \ \ platform:\ "ios",\
\ \ \ \ \ \ \.\.\.paths,\
\ \ \ \ \ \ env:\ \{\
\ \ \ \ \ \ \ \ ASC_API_KEY_P8_BASE64:\ Buffer\.from\(privateKey\)\.toString\("base64"\),\
\ \ \ \ \ \ \ \ ASC_API_KEY_ID:\ "KEY123",\
\ \ \ \ \ \ \ \ ASC_API_KEY_ISSUER_ID:\ "issuer\-123",\
\ \ \ \ \ \ \ \ ASC_APP_ID:\ "1234567890",\
\ \ \ \ \ \ \ \ APPLE_TEAM_ID:\ "ABCDE12345",\
\ \ \ \ \ \ \},\
\ \ \ \ \}\);\
\
\ \ \ \ const\ config\ =\ JSON\.parse\(await\ readFile\(paths\.easPath,\ "utf8"\)\);\
\ \ \ \ const\ profile\ =\ config\.submit\.production\.ios;\
\ \ \ \ expect\(profile\)\.toMatchObject\(\{\
\ \ \ \ \ \ ascApiKeyId:\ "KEY123",\
\ \ \ \ \ \ ascApiKeyIssuerId:\ "issuer\-123",\
\ \ \ \ \ \ ascAppId:\ "1234567890",\
\ \ \ \ \ \ appleTeamId:\ "ABCDE12345",\
\ \ \ \ \}\);\
\ \ \ \ expect\(await\ readFile\(profile\.ascApiKeyPath,\ "utf8"\)\)\.toBe\(privateKey\);\
\ \ \ \ expect\(\(await\ stat\(profile\.ascApiKeyPath\)\)\.mode\ \&\ 0o777\)\.toBe\(0o600\);\
\ \ \}\);\
\
\ \ it\("writes\ a\ validated\ Android\ service\ account\ and\ preserves\ release\ track",\ async\ \(\)\ =>\ \{\
\ \ \ \ const\ paths\ =\ await\ fixture\(\);\
\ \ \ \ const\ credential\ =\ \{\
\ \ \ \ \ \ type:\ "service_account",\
\ \ \ \ \ \ client_email:\ "release@example\.iam\.gserviceaccount\.com",\
\ \ \ \ \ \ private_key:\ "\-\-\-\-\-BEGIN\ PRIVATE\ KEY\-\-\-\-\-$''']


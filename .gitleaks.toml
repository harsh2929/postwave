title = "Postwave public source secret scan"
minVersion = "8.25.0"
[extend]
useDefault = true


[[allowlists]]
description = "Public-source review: Kubernetes secret-key reference name, not its value"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "match"
paths = ['''(?:^|/)infra/backup/postgres\-statefulset\-patch\.yaml$''']
regexes = ['''^key:\ WALG_S3_PREFIX$''']

[[allowlists]]
description = "Public-source review: MD5 template-body checksums"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "match"
paths = ['''(?:^|/)infra/migrations/2055_platform_template_drafts_and_mobile_layout\.sql$''']
regexes = ['''^transactional\-password\-reset\-timed',\ 'c8eb2c30b415b73290fde837a09f9c10'$''']

[[allowlists]]
description = "Public-source review: MD5 template-body checksums"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "match"
paths = ['''(?:^|/)infra/migrations/2055_platform_template_drafts_and_mobile_layout\.sql$''']
regexes = ['''^transactional\-password\-reset\-timed',\ 'dd9bfef30773eabc75b33778b428f746'$''']

[[allowlists]]
description = "Public-source review: OAuth teardown documentation prose"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "match"
paths = ['''(?:^|/)docs/integrations/surveymonkey\.md$''']
regexes = ['''^OAuth\ token\ revocation,\ survey/collector/app\ $''']

[[allowlists]]
description = "Public-source review: SQL column projection, not a credential"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "match"
paths = ['''(?:^|/)apps/api/internal/conversions/signed_ingest\.go$''']
regexes = ['''^secret_envelope,\ legacy_v1_until$''']

[[allowlists]]
description = "Public-source review: SQL privilege predicate, not a credential"

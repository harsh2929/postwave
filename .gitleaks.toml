regexes = ['''^credentialCleanupEvidenceRef:\ "KLAVIYO\-KEY\-ROTATION\-123"$''']

[[allowlists]]
description = "Public-source review: ellipsis API-key placeholder in a curl example"
targetRules = ["curl-auth-header"]
condition = "AND"
regexTarget = "match"
paths = ['''(?:^|/)docs\-site/pages/api\-reference/index\.mdx$''']
regexes = ['''^curl\ https://api\.moosewave\.com/api/v1/subscribers\ \\\
\ \ \-H\ "Authorization:\ Bearer\ pk_live_\.\.\."$''']

[[allowlists]]
description = "Public-source review: environment-variable documentation prose"

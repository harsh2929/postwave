# apps/audit-portal/nginx.conf — hardened, credential-free SPA config.
#
# The portal SPA is served only at /portal/audit. Its one-time bootstrap is
# carried in a URL fragment, which is not transmitted to nginx, and is
# synchronously scrubbed by main.tsx. Legacy token-in-path routes fail closed.
#
# We deliberately do not add aggressive caching for index.html (must
# revalidate so the next deploy is picked up immediately) but do set
# long max-age for the immutable, content-hashed /assets/* files Vite
# produces.

server {
    listen       8080;
    server_name  _;

    # Hide the nginx version banner in error pages / Server: header.
    server_tokens off;
    client_max_body_size 4k;

    # Hashed asset bundles are content-addressed by Vite; safe to cache
    # for a year and serve `immutable`.
    #
    # The stock image leaves `gzip` off in the http block, and this file is
    # installed as a server block so it cannot turn a http-level directive back
    # on globally — compression is enabled here, where the one 200 KB module
    # script lives (it gzips to ~65 KB). `gzip_vary` keeps shared caches honest
    # about the two representations.
    location ~ ^/portal/audit/assets/ {
        root        /usr/share/nginx/html;
        access_log  off;
        gzip        on;
        gzip_vary   on;
        gzip_proxied any;
        gzip_comp_level 6;
        gzip_min_length 1024;
        gzip_types  application/javascript text/javascript text/css application/json image/svg+xml;
        add_header  Cache-Control "public, max-age=31536000, immutable";
        add_header  X-Content-Type-Options "nosniff" always;
        try_files   $uri =404;
    }

    location = /portal/audit {
        root        /usr/share/nginx/html;
        access_log  off;
        add_header  Cache-Control "no-store, private, max-age=0" always;
        add_header  Pragma "no-cache" always;
        add_header  Referrer-Policy "no-referrer" always;
        add_header  X-Content-Type-Options "nosniff" always;
        add_header  Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header  Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self'; base-uri 'none'; object-src 'none'; form-action 'none'; frame-ancestors ${POSTWAVE_PORTAL_FRAME_ANCESTORS}" always;
        try_files   /portal/audit/index.html =404;
    }

    location = /portal/audit/ {
        root        /usr/share/nginx/html;
        access_log  off;
        add_header  Cache-Control "no-store, private, max-age=0" always;
        add_header  Pragma "no-cache" always;
        add_header  Referrer-Policy "no-referrer" always;
        add_header  X-Content-Type-Options "nosniff" always;
        add_header  Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header  Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self'; base-uri 'none'; object-src 'none'; form-action 'none'; frame-ancestors ${POSTWAVE_PORTAL_FRAME_ANCESTORS}" always;
        try_files   /portal/audit/index.html =404;
    }

    # Never reinterpret a legacy /portal/audit/<credential> as an SPA route.
    location /portal/audit/ {
        access_log off;
        return 404;
    }

    # The standalone image preserves the same-origin cookie boundary by
    # proxying only the three public portal endpoints. No dashboard API route
    # is reachable through this container, and credential-bearing requests
    # are excluded from access logs.
    #
    # X-Forwarded-For is appended to, never replaced: this pod sits behind the
    # gateway, so overwriting the chain with $remote_addr would hand the API the
    # gateway's address and every `audit.portal.session_access` row would record
    # infrastructure instead of the auditor. Appending is safe because the API
    # walks the chain rightmost-first and only skips hops inside
    # POSTWAVE_TRUSTED_PROXY_CIDRS, so a client-prepended entry cannot win.
    location = /api/v1/audit/portal/exchange {
        access_log off;
        proxy_pass ${POSTWAVE_API_ORIGIN};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        proxy_buffering off;
        add_header Cache-Control "no-store, private, max-age=0" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /api/v1/audit/portal/branding {
        access_log off;
        proxy_pass ${POSTWAVE_API_ORIGIN};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        add_header Cache-Control "no-store, private, max-age=0" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /api/v1/audit/portal/events {
        access_log off;
        proxy_pass ${POSTWAVE_API_ORIGIN};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 15s;
        add_header Cache-Control "no-store, private, max-age=0" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Anything outside /portal/audit/ is not served by this container.
    location / {
        return 404;
    }
}
